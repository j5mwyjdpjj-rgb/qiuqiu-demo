<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>幼儿园学习工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, -apple-system, "微软雅黑", sans-serif;}
body{background:#f8faff;display:flex;height:100vh;overflow:hidden;}
/* 左侧侧边导航 */
.sidebar{width:260px;background:#fff;border-right:2px solid #e1e7f5;display:flex;flex-direction:column;}
/* 统一左侧头像设置区 */
.sidebar-avatar-box{padding:20px;text-align:center;border-bottom:1px solid #eee;position:relative;}
.main-avatar{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid #4096ff;cursor:pointer;}
.avatar-tip{font-size:13px;color:#888;margin-top:6px;}
/* 侧边菜单 */
.sidebar-menu{flex:1;overflow-y:auto;padding:10px 0;}
.menu-item{padding:14px 24px;font-size:17px;cursor:pointer;display:flex;gap:12px;align-items:center;transition:0.2s;position:relative;}
.menu-item.active{background:#e8f3ff;color:#4096ff;border-left:4px solid #4096ff;}
.menu-item:hover{background:#f0f7ff;}
/* 每个菜单独立小头像 */
.menu-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #cce2ff;cursor:pointer;}
/* 顶部全局导航栏 */
.top-header{height:70px;background:#4096ff;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:20px;}
.logo-box{display:flex;align-items:center;gap:12px;cursor:pointer;}
.logo-img{height:48px;border-radius:8px;object-fit:cover;border:2px solid #fff;}
.header-right{display:flex;align-items:center;gap:20px;font-size:16px;}
.setting-gear{width:44px;height:44px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;color:#4096ff;cursor:pointer;}
/* 主内容区 */
.main-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.content-body{flex:1;padding:20px;overflow-y:auto;}
.card{background:#fff;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 2px 10px #e6ecf7;}
.card-title{font-size:22px;margin-bottom:16px;color:#111;font-weight:600;display:flex;align-items:center;gap:8px;}
.big-btn{padding:14px 20px;font-size:17px;border:none;border-radius:10px;cursor:pointer;font-weight:500;min-width:110px;}
.btn-blue{background:#4096ff;color:#fff;}
.btn-gray{background:#e5e7eb;color:#666;cursor:not-allowed;}
.btn-green{background:#36c96b;color:#fff;}
.btn-orange{background:#ff9500;color:#fff;}
.btn-red{background:#ff5252;color:#fff;}
.flex-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:12px 0;}
/* 弹窗遮罩 */
.mask{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.45);display:none;z-index:9999;align-items:center;justify-content:center;}
.modal{width:92%;max-width:460px;background:#fff;border-radius:20px;padding:28px;max-height:85vh;overflow-y:auto;}
.modal-title{font-size:24px;text-align:center;margin-bottom:24px;font-weight:600;}
.modal-input{width:100%;padding:13px 16px;font-size:17px;border:2px solid #eee;border-radius:10px;margin:10px 0;outline:none;}
.modal-input:focus{border-color:#4096ff;}
.modal-btn-group{display:flex;gap:14px;margin-top:24px;}
.modal-btn{flex:1;padding:14px;border:none;border-radius:10px;font-size:17px;cursor:pointer;}
.modal-cancel{background:#eee;color:#333;}
.modal-save{background:#4096ff;color:#fff;}
/* 兔子SVG宠物 */
.pet-svg{width:200px;height:200px;margin:10px auto;transition:transform 0.3s;}
.pet-jump{animation:petJump 0.4s ease;}
@keyframes petJump{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
.food-item{font-size:42px;margin:8px 12px;cursor:pointer;display:inline-block;}
.food-fly{animation:foodFly 0.6s forwards ease-in;}
@keyframes foodFly{100%{transform:translate(-70px,-90px);opacity:0;}}
/* 日历打卡 */
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:16px 0;}
.cal-day{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid #ddd;}
.cal-day.checked{background:#36c96b;color:#fff;border-color:#36c96b;}
/* 积分商店兑换项 */
.shop-item{padding:16px;border:1px solid #eee;border-radius:12px;width:160px;text-align:center;}
/* 学习题目卡片 */
.question-box{padding:16px;border:1px solid #e1e7f5;border-radius:12px;margin:12px 0;}
.option-btn{width:48%;padding:12px;margin:6px 0;font-size:16px;border:1px solid #ddd;border-radius:10px;background:#f8faff;cursor:pointer;}
.option-btn.correct{background:#36c96b;color:#fff;border-color:#36c96b;}
.option-btn.wrong{background:#ff5252;color:#fff;border-color:#ff5252;}
/* 隐藏文件上传 */
.file-hide{display:none;}
/* 统计文字 */
.stat-text{font-size:18px;margin:6px 0;color:#333;}
/* 错题、备忘录列表 */
.list-item{padding:12px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;}
/* 菜单头像设置弹窗内单项 */
.set-avatar-row{display:flex;align-items:center;justify-content:space-between;margin:14px 0;padding:8px;border-bottom:1px solid #eee;}
.set-preview-img{width:60px;height:60px;border-radius:50%;border:2px solid #4096ff;}
/* 响应式移动端侧边栏折叠 */
@media(max-width:800px){.sidebar{width:220px;}.top-header{padding:0 12px;}}
</style>
</head>

<script>
// ===================== 全局数据初始化（LocalStorage持久化） =====================
const TODAY_STR = new Date().toLocaleDateString();
const STORE_KEY = "kidStudyWorkbenchDataV2";
// 所有菜单头像key列表
const menuKeyList = ["home","score","shop","calendar","hanzi","math","logic","english","poem","expand","error","memo","reward"];
const menuNameMap = {
    home:"宠物首页",score:"积分打卡",shop:"积分商店",calendar:"打卡日历",
    hanzi:"汉字学习",math:"算术天地",logic:"思维训练",english:"英语学习",
    poem:"古诗100首",expand:"每日拓展",error:"错题本",memo:"计划备忘录",reward:"奖励中心"
};
const defaultData = {
    // 用户头像全套
    mainSideAvatar:"",headerLogo:"",
    menuAvatars:{}, // {home:"图片base64",score:""}
    userNick:"宝贝",
    // 宠物兔子养成
    petExp:0,petStage:1,//1兔宝宝 2小兔 3大兔 4英雄兔
    foodStock:{carrot:0,strawberry:0,water:0},//🥕🍓💧
    // 积分系统
    totalScore:71,scoreUsed:200,
    todayCompleteTasks:[],//今日已完成打卡，防止重复加分
    scoreRecords:[],//积分历史（可撤回）
    calendarCheck:[],//日历打卡记录 [{date:"2026/8/1",continue:1}]
    continueDay:0,
    // 学习题库每日标识（次日自动刷新）
    lastStudyDate:TODAY_STR,
    todayHanzi:[],todayMath:[],todayLogic:[],todayEnglish:[],todayExpand:[],
    // 错题本
    errorList:[],
    // 备忘录
    memoList:[],
    // 已学古诗
    learnedPoemIds:[],
    // 今日学习统计
    todayDoCount:0,todayCorrect:0,todaySerialRight:0,maxSerialRight:0
};
// 读取本地存储
function getLocalData(){
    const cache = localStorage.getItem(STORE_KEY);
    if(!cache) return JSON.parse(JSON.stringify(defaultData));
    const data = JSON.parse(cache);
    // 初始化空白菜单头像
    menuKeyList.forEach(key=>{if(!data.menuAvatars[key])data.menuAvatars[key]=""})
    // 判断是否跨天，重置当日任务
    if(data.lastStudyDate !== TODAY_STR){
        data.lastStudyDate = TODAY_STR;
        data.todayCompleteTasks = [];
        data.todayDoCount = 0;
        data.todayCorrect = 0;
        data.todaySerialRight = 0;
        generateTodayAllQuestion(data);
    }
    return data;
}
function saveLocalData(data){
    localStorage.setItem(STORE_KEY,JSON.stringify(data));
}
let appData = getLocalData();
const fileInput = document.getElementById("globalFileInput");
let currentEditAvatarKey = "";

// ===================== 语音朗读工具（中文+英式英语en-GB） =====================
function speakVoice(text,isEnglish=false){
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 0.75;
    utter.pitch = 1;
    if(isEnglish){
        utter.lang = "en-GB";
        const voices = speechSynthesis.getVoices();
        const ukVoice = voices.find(v=>v.lang==="en-GB" && v.name.includes("Female"));
        if(ukVoice) utter.voice = ukVoice;
    }else{
        utter.lang = "zh-CN";
    }
    speechSynthesis.speak(utter);
}

// ===================== 每日自动生成学习题库 =====================
function generateTodayAllQuestion(data){
    // 1.汉字库（每日5字）
    const hanziPool = [
        {char:"山",pinyin:"shān",emoji:"⛰️",word:"大山、山水"},
        {char:"水",pinyin:"shuǐ",emoji:"💧",word:"河水、水果"},
        {char:"日",pinyin:"rì",emoji:"☀️",word:"日月、日出"},
        {char:"月",pinyin:"yuè",emoji:"🌙",word:"月亮、月光"},
        {char:"人",pinyin:"rén",emoji:"👶",word:"人们、大人"},
        {char:"手",pinyin:"shǒu",emoji:"✋",word:"小手、手指"},
        {char:"口",pinyin:"kǒu",emoji:"👄",word:"开口、口水"},
        {char:"木",pinyin:"mù",emoji:"🌳",word:"木头、树木"}
    ];
    data.todayHanzi = shuffleArray([...hanziPool]).slice(0,5);
    // 2.算术10以内加减
    data.todayMath = [];
    for(let i=0;i<8;i++){
        let a = Math.floor(Math.random()*10)+1;
        let b = Math.floor(Math.random()*10)+1;
        let op = Math.random()>0.5 ? "+" : "-";
        let ans = op==="+" ? a+b : a-b;
        if(ans<0){[a,b]=[b,a];op="-";ans=a-b;}
        let opts = new Set([ans]);
        while(opts.size<4){
            let r = ans + Math.floor(Math.random()*5)-2;
            if(r>=0 && r<=10) opts.add(r);
        }
        data.todayMath.push({a,b,op,ans,opts:Array.from(opts)});
    }
    // 3.思维训练简易题库
    data.todayLogic = [
        {type:"比较大小",title:"找出数字更大的",opt:[2,5,1,3],correct:1},
        {type:"图形推理",title:"圆形是哪一个",opt:["△","○","□","◇"],correct:1},
        {type:"数字规律",title:"1,3,5,？",opt:[6,7,8,9],correct:1},
        {type:"时间认知",title:"太阳出来是早上",opt:["晚上","早上","半夜","中午"],correct:1},
        {type:"生活数学",title:"3颗糖吃掉1颗剩几颗",opt:[1,2,3,4],correct:1}
    ];
    // 4.英语单词库
    data.todayEnglish = [
        {word:"apple",cn:"苹果",emoji:"🍎"},
        {word:"cat",cn:"小猫",emoji:"🐱"},
        {word:"dog",cn:"小狗",emoji:"🐶"},
        {word:"bird",cn:"小鸟",emoji:"🐦"},
        {word:"milk",cn:"牛奶",emoji:"🥛"}
    ];
    // 5.每日拓展卡片
    data.todayExpand = [
        {title:"今日小知识",content:"小兔子爱吃胡萝卜和青菜",voiceText:"小兔子爱吃胡萝卜和青菜"},
        {title:"动手实验",content:"清水加几滴色素搅拌观察",voiceText:"清水加几滴色素搅拌观察"},
        {title:"故事时间",content:"龟兔赛跑的小故事",voiceText:"龟兔赛跑的小故事"},
        {title:"儿歌推荐",content:"两只老虎儿歌",voiceText:"两只老虎儿歌"},
        {title:"每日挑战",content:"独立收拾全部玩具",voiceText:"独立收拾全部玩具"}
    ];
}
// 数组随机打乱
function shuffleArray(arr){
    const copy = [...arr];
    for(let i=copy.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [copy[i],copy[j]] = [copy[j],copy[i]];
    }
    return copy;
}

// ===================== 积分加减核心逻辑 =====================
const scoreAddList = [
    {name:"英文打卡30分钟",score:2,id:"eng30"},
    {name:"跳绳1000次",score:10,id:"jump1000"},
    {name:"跳绳500次",score:5,id:"jump500"},
    {name:"跳绳100次",score:1,id:"jump100"},
    {name:"唇肌训练15分钟",score:1,id:"lip15"},
    {name:"帮忙做家务",score:1,id:"houseworkHelp"},
    {name:"完成作业",score:1,id:"finishHomework"},
    {name:"30分钟吃完饭",score:1,id:"fastEat"},

    {name:"吊单杆3分钟",score:2,id:"bar3"},
    {name:"吊单杆5分钟",score:5,id:"bar5"},
    {name:"晚上9点上床睡觉",score:2,id:"sleep9"},
    {name:"学校老师表扬",score:1,id:"praiseSchool"},
];
const scoreMinusList = [
    {name:"不做家务",score:-1,id:"noHousework"},
    {name:"抠鼻子",score:-1,id:"pickNose"},
    {name:"抠鼻子出血",score:-5,id:"noseBleed"},
    {name:"22点未睡觉",score:-1,id:"sleep22late"},
    {name:"22:30未睡",score:-2,id:"sleep2230late"},
    {name:"23点未睡",score:-5,id:"sleep23late"},
    {name:"23:30未睡",score:-10,id:"sleep2330late"},
    {name:"吃饭超过30分钟",score:-2,id:"slowEat"},
    {name:"不收拾玩具",score:-2,id:"noToyClean"},
    {name:"乱发脾气",score:-1,id:"angry"},
    {name:"看电视超时",score:-3,id:"tvOver"},
    {name:"做事拖拉",score:-1,id:"drag"},
    {name:"未跳绳",score:-2,id:"noJump"},
    {name:"未唇肌训练",score:-1,id:"noLip"},
    {name:"撒谎不诚实",score:-5,id:"lie"},
    {name:"吃饭中途小便",score:-2,id:"eatPee"},
    {name:"吃饭中途大便",score:-5,id:"eatPoop"},
];
// 积分商店兑换商品
const shopGoods = [
    {name:"小玩具",need:200,type:"toy"},
    {name:"看电视20分钟",need:20,type:"tv20"},
    {name:"Switch游玩",need:50,type:"switch"},
    {name:"免费户外活动",need:30,type:"outdoor"},
    {name:"零花钱20元",need:80,type:"money20"},
    {name:"电影+游戏厅",need:150,type:"cinemaGame"},
    {name:"自由管家一天",need:300,type:"freeManage"},
    {name:"旅行/博物馆",need:500,type:"travel"},
];
// 执行加分/扣分（记录历史，支持撤回，当日不可重复操作）
function handleScoreChange(item,isAdd=true,customText=""){
    const taskId = item.id;
    if(appData.todayCompleteTasks.includes(taskId)){
        alert("今日该任务已完成，不能重复操作！");
        return;
    }
    const changeScore = item.score;
    appData.totalScore += changeScore;
    appData.todayCompleteTasks.push(taskId);
    appData.scoreRecords.push({
        date:TODAY_STR,
        taskName:customText || item.name,
        score:changeScore,
        taskId:taskId,
        recordId:Date.now()
    });
    saveLocalData(appData);
    alert(isAdd ? `太棒啦！获得${changeScore}积分` : `要改正哦，扣除${Math.abs(changeScore)}积分`);
    renderCurrentPage();
}
// 撤回积分记录
function revertScoreRecord(recordId){
    const recordIdx = appData.scoreRecords.findIndex(r=>r.recordId===recordId);
    if(recordIdx===-1)return;
    const record = appData.scoreRecords[recordIdx];
    appData.totalScore -= record.score;

    renderCurrentPage();

// 喂食增加经验
function feedPet(type){
    const foodMap = {water:{exp:6,key:"water",em:"💧"},carrot:{exp:8,key:"carrot",em:"🥕"},strawberry:{exp:10,key:"strawberry",em:"🍓"}};
    const food = foodMap[type];
    if(appData.foodStock[food.key]<=0){
        alert("暂无该食物，完成学习任务获取！");
        return;
    }
    appData.foodStock[food.key]--;
    appData.petExp += food.exp;
    if(appData.petExp >=500) appData.petStage=4;
    else if(appData.petExp>=250) appData.petStage=3;
    else if(appData.petExp>=100) appData.petStage=2;
    else appData.petStage=1;
    saveLocalData(appData);
    renderCurrentPage();
}
// 完成学习任务发放对应食物
function giveFoodReward(foodType){
    if(foodType==="carrot") appData.foodStock.carrot++;
    if(foodType==="strawberry") appData.foodStock.strawberry++;
    if(foodType==="water") appData.foodStock.water++;
    saveLocalData(appData);
}

    appData.todayDoCount++;

        boxDom.querySelectorAll(".option-btn")[optIdx].classList.add("correct");
        appData.todayCorrect++;appData.todaySerialRight++;
        if(appData.todaySerialRight>appData.maxSerialRight) appData.maxSerialRight = appData.todaySerialRight;
        giveFoodReward("water");
        speakVoice("回答正确，获得露水一滴");

        boxDom.querySelectorAll(".option-btn")[optIdx].classList.add("wrong");
        appData.todaySerialRight=0;
        speakVoice("答错啦，再试一试");
        appData.errorList.push({type:"算术",q:`${q.a}${q.op}${q.b}`,rightAns:q.ans,time:TODAY_STR});

    saveLocalData(appData);
}
