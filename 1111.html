<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>球球工作台 · 布鲁伊</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f7f3eb; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 12px; }
        .app { max-width: 500px; width: 100%; background: #fffaf2; border-radius: 40px 40px 24px 24px; box-shadow: 0 12px 30px rgba(0,0,0,0.1); overflow: hidden; padding-bottom: 20px; }

        /* 顶部 */
        .top-bar { display: flex; align-items: center; padding: 14px 18px; background: #fef7ed; border-bottom: 1px solid #efe4d5; gap: 8px; }
        .top-avatar { width: 40px; height: 40px; border-radius: 30px; background: #d9c8b4; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; overflow: hidden; border: 2px solid #b29782; }
        .top-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .top-title { flex:1; font-weight: 700; font-size: 18px; color: #3f2e1e; letter-spacing: 0.5px; }
        .top-badge { background: #f4a261; color: #2d1f12; font-weight: 700; padding: 4px 12px; border-radius: 40px; font-size: 14px; display: flex; align-items: center; gap: 4px; }
        .top-settings { font-size: 22px; cursor: pointer; padding: 0 4px; }

        /* nav */
        .nav { display: flex; flex-wrap: wrap; justify-content: space-around; background: #fcf5ec; padding: 8px 6px 4px; border-bottom: 1px solid #e5d8c8; gap: 2px; }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; font-weight: 600; color: #4e3a28; padding: 4px 6px; border-radius: 30px; background: transparent; transition: 0.1s; cursor: pointer; min-width: 44px; }
        .nav-item.active { background: #e6d6c2; color: #2b1c0e; }
        .nav-emoji { font-size: 26px; line-height: 1.2; }
        .nav-label { font-size: 9px; opacity: 0.8; }

        /* 内容 */
        .page { display: none; padding: 16px 14px 12px; }
        .page.active { display: block; }

        .banner { background: #e7d6c0; border-radius: 30px; padding: 12px 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
        .banner-avatar { width: 48px; height: 48px; border-radius: 40px; background: #b7a084; display: flex; align-items: center; justify-content: center; font-size: 32px; overflow: hidden; }
        .banner-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .banner-text { font-weight: 700; font-size: 18px; color: #3f2c1a; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: #fffcf5; border-radius: 20px; padding: 14px 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); border: 1px solid #eee3d6; }
        .card-icon { font-size: 32px; display: block; margin-bottom: 4px; }
        .card-title { font-weight: 600; font-size: 15px; }
        .card-sub { color: #5f4b36; font-size: 13px; }
        .badge-point { background: #f4b37a; padding: 2px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; display: inline-block; }

        button, .btn-like { background: #efdccb; border: none; padding: 6px 14px; border-radius: 40px; font-weight: 600; color: #2e1f12; cursor: pointer; font-size: 14px; transition: 0.1s; border: 1px solid #dccbbc; }
        button:active { background: #dac6b2; }
        .btn-primary { background: #c9b09b; color: #22170e; border-color: #b3977f; }

        .hamster-status { background: #f7efe6; border-radius: 28px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        .hamster-line { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .hamster-emoji { font-size: 44px; }
        .hamster-msg { font-weight: 600; font-size: 16px; color: #2b1f13; flex:1; }
        .hamster-task { display: flex; gap: 12px; flex-wrap: wrap; }
        .task-chip { background: #e7d7c2; padding: 4px 14px; border-radius: 30px; font-size: 13px; }

        .rule-card { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .rule-icon { font-size: 28px; width: 32px; }
        .rule-name { flex:1; font-weight: 500; }
        .rule-points { background: #ebd5be; padding: 0 10px; border-radius: 20px; font-weight: 600; }

        .shop-card { display: flex; flex-direction: column; align-items: center; background: #faf1e7; border-radius: 24px; padding: 12px 6px; }
        .shop-icon { font-size: 38px; }
        .shop-name { font-weight: 600; }
        .shop-price { background: #dac2ab; padding: 2px 12px; border-radius: 30px; margin: 4px 0; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; margin: 8px 0; }
        .cal-day { text-align: center; background: #f6ede3; border-radius: 30px; padding: 6px 0; font-size: 13px; }
        .cal-day.today { background: #c7b09b; color: #1f140c; font-weight: 700; }

        .study-card { background: #fbf6ef; border-radius: 20px; padding: 12px; margin-bottom: 10px; }
        .study-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .speaker { font-size: 22px; cursor: pointer; }

        .pinyin-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
        .pinyin-card { background: #f2e7db; border-radius: 30px; padding: 12px 4px; text-align: center; }

        .english-card { background: #f7efe6; border-radius: 24px; padding: 16px; }

        .modal-overlay { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.3); backdrop-filter: blur(2px); justify-content: center; align-items: center; z-index: 999; }
        .modal { background: #fff8f0; max-width: 380px; width: 90%; border-radius: 48px; padding: 24px 20px; max-height: 80vh; overflow-y: auto; }
        .modal h3 { margin-bottom: 12px; }
        .avatar-setting-item { display: flex; align-items: center; gap: 12px; margin: 8px 0; border-bottom: 1px solid #eee1d2; padding: 6px 0; }
        .avatar-setting-item .label { font-weight: 500; width: 70px; }

        .inline-flex { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .mt-8 { margin-top: 8px; }
        .mb-8 { margin-bottom: 8px; }
        .text-muted { color: #7a624a; font-size: 13px; }
        .w-full { width:100%; }
        .flex-center { display: flex; align-items: center; justify-content: center; }
        .gap-4 { gap:4px; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="app" id="app">
    <!-- 顶部 -->
    <div class="top-bar">
        <div class="top-avatar" id="topAvatar">🐶</div>
        <span class="top-title">球球工作台</span>
        <span class="top-badge" id="topScore">🏅 71</span>
        <span class="top-settings" id="settingsBtn">⚙️</span>
    </div>

    <!-- 导航 -->
    <div class="nav" id="navBar">
        <div class="nav-item active" data-page="pageHamster"><span class="nav-emoji">🐹</span><span class="nav-label">小仓鼠</span></div>
        <div class="nav-item" data-page="pageBingo"><span class="nav-emoji">🐾</span><span class="nav-label">积分规则</span></div>
        <div class="nav-item" data-page="pageChilli"><span class="nav-emoji">🧸</span><span class="nav-label">积分商店</span></div>
        <div class="nav-item" data-page="pageBandit"><span class="nav-emoji">📅</span><span class="nav-label">积分日历</span></div>
        <div class="nav-item" data-page="pageMuffin"><span class="nav-emoji">📖</span><span class="nav-label">每日练习</span></div>
        <div class="nav-item" data-page="pageSocks"><span class="nav-emoji">🧦</span><span class="nav-label">英文学习</span></div>
    </div>

    <!-- 页面容器 -->
    <div id="pageContainer">
        <!-- 小仓鼠 -->
        <div class="page active" id="pageHamster">
            <div class="banner"><div class="banner-avatar" id="hamsterBannerAvatar">🐹</div><span class="banner-text">布鲁伊的小仓鼠</span></div>
            <div class="hamster-status" id="hamsterStatus">
                <div class="hamster-line"><span class="hamster-emoji" id="hamsterEmoji">😡</span><span class="hamster-msg" id="hamsterMsg">我好饿好生气！快去完成任务喂我！</span></div>
                <div class="hamster-task" id="hamsterTasks"></div>
                <button id="feedBtn" disabled style="margin-top:8px;">🥣 喂食</button>
            </div>
            <div class="grid-2">
                <div class="card"><span class="card-icon">🏆</span><div class="card-title">今日打卡</div><div class="card-sub" id="todayTaskStats">0/3</div></div>
                <div class="card"><span class="card-icon">❤️</span><div class="card-title">已喂</div><div class="card-sub" id="feedCountDisplay">0 次</div></div>
            </div>
            <div style="margin-top:12px;"><button id="resetDailyBtn" class="btn-primary">重置今日任务 (测试)</button></div>
        </div>

        <!-- 宾果 积分规则 -->
        <div class="page" id="pageBingo">
            <div class="banner"><div class="banner-avatar" id="bingoBannerAvatar">🐾</div><span class="banner-text">宾果的积分规则</span></div>
            <div class="grid-2" id="ruleGrid"></div>
        </div>

        <!-- Chilli 商店 -->
        <div class="page" id="pageChilli">
            <div class="banner"><div class="banner-avatar" id="chilliBannerAvatar">🧸</div><span class="banner-text">妈妈的积分商店</span></div>
            <div class="grid-2" id="shopGrid"></div>
        </div>

        <!-- Bandit 日历 -->
        <div class="page" id="pageBandit">
            <div class="banner"><div class="banner-avatar" id="banditBannerAvatar">📅</div><span class="banner-text">爸爸的积分日历</span></div>
            <div style="display:flex; gap:8px; margin-bottom:12px;">
                <span class="badge-point">今日 +0</span><span class="badge-point">本周 +0</span><span class="badge-point">本月 +0</span>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
            <div id="dailyLogs" style="margin-top:10px; max-height:160px; overflow-y:auto; background:#f6ede3; border-radius:20px; padding:8px;"></div>
        </div>

        <!-- Muffin 练习 -->
        <div class="page" id="pageMuffin">
            <div class="banner"><div class="banner-avatar" id="muffinBannerAvatar">📖</div><span class="banner-text">每日练习 · 5科</span></div>
            <div id="studyContainer"></div>
        </div>

        <!-- Socks 英文 -->
        <div class="page" id="pageSocks">
            <div class="banner"><div class="banner-avatar" id="socksBannerAvatar">🧦</div><span class="banner-text">Socks 英文学习</span></div>
            <div id="socksContainer"></div>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <h3>⚙️ 头像设置</h3>
            <div id="avatarSettingList"></div>
            <button id="closeSettings" style="margin-top:12px;">关闭</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- 数据 ----------
        const STORE_KEY = 'qiqiu_data';
        const AVATAR_KEY = 'qiqiu_avatars';
        let data = loadData();
        let avatars = loadAvatars();

        function defaultData() {
            return {
                score: 71,
                exchanged: 200,
                tasks: { english: false, rope: false, lip: false },
                feedCount: 0,
                todayDate: new Date().toDateString(),
                logs: [], // {date, desc, delta, timestamp}
                studyProgress: {}, // 练习完成标记
                learnedWords: [], // socks
                shopExchanges: {},
            };
        }

        function loadData() {
            try {
                const raw = localStorage.getItem(STORE_KEY);
                if (raw) { const d = JSON.parse(raw); if (d && typeof d === 'object') return d; }
            } catch(e) {}
            return defaultData();
        }

        function saveData() { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }

        function loadAvatars() {
            try { return JSON.parse(localStorage.getItem(AVATAR_KEY)) || {}; } catch(e){ return {}; }
        }
        function saveAvatars() { localStorage.setItem(AVATAR_KEY, JSON.stringify(avatars)); }

        // 头像辅助
        function getAvatarHTML(char, size=40) {
            const key = char.toLowerCase();
            const url = avatars[key];
            if (url) return `<img src="${url}" style="width:${size}px;height:${size}px;object-fit:cover;border-radius:30px;" />`;
            const emojis = { bluey:'🐶', bingo:'🐾', chilli:'🧸', bandit:'📅', muffin:'📖', socks:'🧦', hamster:'🐹' };
            return `<span style="font-size:${size-6}px;">${emojis[key]||'🐾'}</span>`;
        }

        // 更新顶部
        function updateTop() {
            document.getElementById('topAvatar').innerHTML = getAvatarHTML('bluey', 36);
            document.getElementById('topScore').innerHTML = `🏅 ${data.score}`;
        }

        // 打卡系统
        const TASK_NAMES = ['英文打卡30分钟', '跳绳1000次', '唇肌训练15分钟'];
        const TASK_KEYS = ['english', 'rope', 'lip'];
        const TASK_POINTS = [2, 10, 1]; // 跳绳额外按次数

        function getTaskCount() {
            return TASK_KEYS.filter(k => data.tasks[k]).length;
        }

        function getHamsterState() {
            const done = getTaskCount();
            if (done === 0) return { emoji:'😡', msg:'我好饿好生气！快去完成任务喂我！', canFeed:false, fed:false };
            if (done === 1 || done === 2) {
                const left = 3 - done;
                return { emoji:'🥺', msg:`再完成${left}个任务就能喂我啦~`, canFeed:false, fed:false };
            }
            if (done === 3) {
                // 检查是否今天已经喂过
                const today = new Date().toDateString();
                const fedToday = data.feedDate === today;
                if (fedToday) return { emoji:'🤩', msg:'仓鼠吃饱啦，开心快乐地转轮子呢！', canFeed:false, fed:true };
                return { emoji:'😋', msg:'3个任务全完成！快给我粮食吧！（按钮可点）', canFeed:true, fed:false };
            }
            return { emoji:'😡', msg:'状态异常', canFeed:false, fed:false };
        }

        function renderHamster() {
            const state = getHamsterState();
            document.getElementById('hamsterEmoji').textContent = state.emoji;
            document.getElementById('hamsterMsg').textContent = state.msg;
            document.getElementById('feedBtn').disabled = !state.canFeed;
            // 任务列表
            const container = document.getElementById('hamsterTasks');
            container.innerHTML = TASK_NAMES.map((name,i) => {
                const done = data.tasks[TASK_KEYS[i]];
                return `<span class="task-chip">${done?'✅':'⬜'} ${name}</span>`;
            }).join('');
            document.getElementById('todayTaskStats').textContent = `${getTaskCount()}/3`;
            document.getElementById('feedCountDisplay').textContent = `${data.feedCount || 0} 次`;
            // banner avatar
            document.getElementById('hamsterBannerAvatar').innerHTML = getAvatarHTML('hamster', 44);
        }

        // 喂食
        function feedHamster() {
            const state = getHamsterState();
            if (!state.canFeed) return;
            data.feedCount = (data.feedCount || 0) + 1;
            data.feedDate = new Date().toDateString();
            // 重置任务 (喂完自动重置)
            data.tasks = { english: false, rope: false, lip: false };
            saveData();
            renderHamster();
            renderAll();
        }

        // 任务打卡 (加分)
        function toggleTask(key, point) {
            if (data.tasks[key]) return; // 已完成不能取消
            data.tasks[key] = true;
            data.score += point;
            data.logs.push({ date: new Date().toISOString(), desc: `打卡: ${TASK_NAMES[TASK_KEYS.indexOf(key)]} +${point}`, delta: point, timestamp: Date.now() });
            saveData();
            renderHamster();
            renderAll();
        }

        // 规则数据
        const rules = [
            { icon:'📖', name:'英文打卡30分钟', points:2, multi:false },
            { icon:'🏃', name:'跳绳1000次', points:10, multi:true, opts:[1000,500,300,100] },
            { icon:'💪', name:'唇肌训练15分钟', points:1, multi:false },
            { icon:'🧹', name:'帮忙做家务', points:1, multi:false },
            { icon:'📚', name:'完成作业', points:1, multi:false },
            { icon:'🍽️', name:'30分钟吃完饭', points:1, multi:false },
            { icon:'⏰', name:'按时起床', points:1, multi:false },
            { icon:'🏋️', name:'吊单杆3分钟', points:2, multi:true, opts:[3,5] },
            { icon:'🌙', name:'晚上9点上床睡觉', points:2, multi:false },
            { icon:'⭐', name:'被老师或学校表扬', points:1, multi:false },
            { icon:'➕', name:'自定义加分', points:0, multi:false, custom:true },
            { icon:'❌', name:'不帮忙做家务', points:-1, multi:false },
            { icon:'👃', name:'抠鼻子', points:-1, multi:false },
            { icon:'🩸', name:'抠鼻子出血', points:-5, multi:false },
            { icon:'🌙', name:'晚上10点没睡觉', points:-1, multi:false },
            { icon:'🌙', name:'10点半没睡', points:-2, multi:false },
            { icon:'🌙', name:'11点没睡', points:-5, multi:false },
            { icon:'🌙', name:'11点半没睡', points:-10, multi:false },
            { icon:'🍽️', name:'吃饭超30分钟', points:-2, multi:false },
            { icon:'🧸', name:'没有收拾玩具', points:-2, multi:false },
            { icon:'😤', name:'乱发脾气', points:-1, multi:false },
            { icon:'📺', name:'看电视超时', points:-3, multi:false },
            { icon:'🐢', name:'做事情拖拉', points:-1, multi:false },
            { icon:'🚫', name:'没有跳绳', points:-2, multi:false },
            { icon:'🚫', name:'没有唇肌训练', points:-1, multi:false },
            { icon:'🤥', name:'撒谎不诚实', points:-5, multi:false },
            { icon:'🚽', name:'吃饭中途拉尿', points:-2, multi:false },
            { icon:'💩', name:'拉屎扣分', points:-5, multi:false },
            { icon:'➖', name:'自定义扣分', points:0, multi:false, custom:true },
        ];

        // 商店
        const shopItems = [
            { icon:'🧸', name:'玩具', price:200 },
            { icon:'📺', name:'看电视20分钟', price:20 },
            { icon:'🎮', name:'玩Switch分钟', price:50 },
            { icon:'🌳', name:'免费户外活动', price:30 },
            { icon:'💰', name:'零花钱20', price:80 },
            { icon:'🎬', name:'看电影和游戏厅', price:150 },
            { icon:'🏠', name:'自由管家', price:300 },
            { icon:'✈️', name:'旅行和博物馆', price:500 },
            { icon:'🛒', name:'自定义兑换', price:0, custom:true },
        ];

        // 渲染规则
        function renderRules() {
            const grid = document.getElementById('ruleGrid');
            grid.innerHTML = rules.map((r,i) => {
                const pts = r.points;
                const label = pts>0?`+${pts}`: `${pts}`;
                let extra = '';
                if (r.multi) {
                    extra = `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;">${r.opts.map(v => `<button class="btn-like" style="font-size:12px;padding:2px 8px;" data-ruleidx="${i}" data-val="${v}">${v}</button>`).join('')}</div>`;
                }
                return `<div class="card rule-card"><span class="rule-icon">${r.icon}</span><span class="rule-name">${r.name}</span><span class="rule-points">${label}</span>${extra}</div>`;
            }).join('');
            // 绑定跳绳/吊单杆
            document.querySelectorAll('[data-ruleidx]').forEach(btn => {
                btn.onclick = function() {
                    const idx = parseInt(this.dataset.ruleidx);
                    const val = parseInt(this.dataset.val);
                    const rule = rules[idx];
                    let pts = rule.points;
                    if (rule.name.includes('跳绳')) {
                        if (val === 1000) pts = 10;
                        else if (val === 500) pts = 5;
                        else if (val === 300) pts = 3;
                        else if (val === 100) pts = 1;
                    } else if (rule.name.includes('吊单杆')) {
                        if (val === 5) pts = 5;
                        else pts = 2;
                    }
                    data.score += pts;
                    data.logs.push({ date: new Date().toISOString(), desc: `${rule.name} ${val}次 +${pts}`, delta: pts, timestamp: Date.now() });
                    saveData();
                    renderAll();
                };
            });
        }

        // 渲染商店
        function renderShop() {
            const grid = document.getElementById('shopGrid');
            grid.innerHTML = shopItems.map((item, idx) => {
                const price = item.price;
                return `<div class="shop-card"><span class="shop-icon">${item.icon}</span><span class="shop-name">${item.name}</span><span class="shop-price">${price}分</span><button data-shopidx="${idx}" class="btn-like">兑换</button></div>`;
            }).join('');
            document.querySelectorAll('[data-shopidx]').forEach(btn => {
                btn.onclick = function() {
                    const idx = parseInt(this.dataset.shopidx);
                    const item = shopItems[idx];
                    if (item.custom) {
                        const name = prompt('自定义兑换名称');
                        if (!name) return;
                        const price = parseInt(prompt('输入积分价格'));
                        if (isNaN(price)) return;
                        if (data.score < price) { alert('积分不足'); return; }
                        data.score -= price;
                        data.logs.push({ date: new Date().toISOString(), desc: `兑换: ${name} -${price}`, delta: -price, timestamp: Date.now() });
                        saveData();
                        renderAll();
                        return;
                    }
                    if (data.score < item.price) { alert('积分不足'); return; }
                    data.score -= item.price;
                    data.logs.push({ date: new Date().toISOString(), desc: `兑换: ${item.name} -${item.price}`, delta: -item.price, timestamp: Date.now() });
                    saveData();
                    renderAll();
                };
            });
        }

        // 日历
        function renderCalendar() {
            const now = new Date();
            const year = now.getFullYear(), month = now.getMonth();
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month+1, 0).getDate();
            const grid = document.getElementById('calendarGrid');
            let html = '';
            for (let i=0; i<firstDay; i++) html += '<div></div>';
            for (let d=1; d<=daysInMonth; d++) {
                const isToday = (d === now.getDate());
                html += `<div class="cal-day ${isToday?'today':''}">${d}</div>`;
            }
            grid.innerHTML = html;
            // 日志
            const logsDiv = document.getElementById('dailyLogs');
            const todayStr = now.toDateString();
            const todayLogs = data.logs.filter(l => new Date(l.date).toDateString() === todayStr);
            logsDiv.innerHTML = todayLogs.length ? todayLogs.map(l => `<div>${l.desc} ${l.delta>0?'+':''}${l.delta}</div>`).join('') : '<div class="text-muted">今日无记录</div>';
        }

        // 练习 (Muffin) 简化
        function renderStudy() {
            const container = document.getElementById('studyContainer');
            const subjects = ['识字','古诗','算术','思维','拼音'];
            const icons = ['📝','📜','🔢','🧠','🔤'];
            container.innerHTML = subjects.map((s,i) => `
                <div class="study-card"><div class="study-row"><span style="font-size:28px;">${icons[i]}</span><strong>${s}</strong><span class="speaker" data-subject="${i}">🔊</span><button class="btn-like" data-study="${i}">✓ 完成 +1</button></div><div class="text-muted">进度: 0/30</div></div>
            `).join('');
            document.querySelectorAll('[data-study]').forEach(btn => {
                btn.onclick = function() {
                    data.score += 1;
                    data.logs.push({ date: new Date().toISOString(), desc: `练习完成 +1`, delta:1, timestamp: Date.now() });
                    saveData();
                    renderAll();
                };
            });
        }

        // Socks 英文 (简化)
        function renderSocks() {
            const container = document.getElementById('socksContainer');
            const words = ['apple','banana','cat','dog','elephant','fish','grape','hat','ice','juice'];
            container.innerHTML = `<div class="english-card"><span style="font-size:40px;">🍎</span><div style="font-size:28px;font-weight:700;color:#6b4f8a;">apple</div><div>苹果</div><button class="btn-like" data-socks="learn">✓ 学会了</button><div style="margin-top:8px;">已学会: ${data.learnedWords?.length||0}</div></div>`;
            document.querySelector('[data-socks="learn"]')?.addEventListener('click', function() {
                if (!data.learnedWords) data.learnedWords = [];
                data.learnedWords.push('apple');
                saveData();
                renderAll();
            });
        }

        // 汇总渲染
        function renderAll() {
            updateTop();
            renderHamster();
            renderRules();
            renderShop();
            renderCalendar();
            renderStudy();
            renderSocks();
            // banner avatars
            ['bingo','chilli','bandit','muffin','socks'].forEach(id => {
                const el = document.getElementById(id+'BannerAvatar');
                if (el) el.innerHTML = getAvatarHTML(id, 44);
            });
        }

        // 导航切换
        document.querySelectorAll('.nav-item').forEach(item => {
            item.onclick = function() {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                this.classList.add('active');
                const pageId = this.dataset.page;
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById(pageId).classList.add('active');
            };
        });

        // 设置弹窗
        document.getElementById('settingsBtn').onclick = function() {
            const modal = document.getElementById('settingsModal');
            modal.style.display = 'flex';
            const list = document.getElementById('avatarSettingList');
            const roles = ['bluey','bingo','chilli','bandit','muffin','socks','hamster'];
            list.innerHTML = roles.map(r => {
                const has = avatars[r];
                return `<div class="avatar-setting-item"><span class="label">${r}</span><input type="file" accept="image/*" data-role="${r}" style="flex:1;max-width:120px;" /><button data-role="${r}" class="btn-like del-avatar">删除</button>${has?'✅':''}</div>`;
            }).join('');
            document.querySelectorAll('input[type="file"]').forEach(inp => {
                inp.onchange = function(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        avatars[this.dataset.role] = ev.target.result;
                        saveAvatars();
                        renderAll();
                        document.getElementById('settingsModal').style.display = 'none';
                    }.bind(this);
                    reader.readAsDataURL(file);
                };
            });
            document.querySelectorAll('.del-avatar').forEach(btn => {
                btn.onclick = function() {
                    delete avatars[this.dataset.role];
                    saveAvatars();
                    renderAll();
                    document.getElementById('settingsModal').style.display = 'none';
                };
            });
        };
        document.getElementById('closeSettings').onclick = function() {
            document.getElementById('settingsModal').style.display = 'none';
        };
        window.onclick = function(e) {
            if (e.target === document.getElementById('settingsModal')) document.getElementById('settingsModal').style.display = 'none';
        };

        // 喂食
        document.getElementById('feedBtn').onclick = feedHamster;

        // 重置 (测试)
        document.getElementById('resetDailyBtn').onclick = function() {
            data.tasks = { english: false, rope: false, lip: false };
            data.feedDate = null;
            saveData();
            renderAll();
        };

        // 打卡快速绑定 (在页面加载后监听)
        document.addEventListener('click', function(e) {
            // 任务打卡点击 (规则卡片中也有)
        });

        // 额外: 给任务卡片添加点击 (在renderHamster中已展示)
        // 任务打卡点击通过hamsterTasks 代理
        document.getElementById('hamsterTasks').addEventListener('click', function(e) {
            const chip = e.target.closest('.task-chip');
            if (!chip) return;
            const idx = Array.from(this.children).indexOf(chip);
            if (idx === -1) return;
            const key = TASK_KEYS[idx];
            if (data.tasks[key]) return;
            const pts = TASK_POINTS[idx];
            toggleTask(key, pts);
        });

        // 初始化
        renderAll();
    })();
</script>
</body>
</html>
